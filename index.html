<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Validator and Converter</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Excel Validator <span>and Converter</span></h1>
            <p>Преобразование Excel в CSV и проверка данных</p>
        </header>

        <main class="card">
            <div id="dropzone" class="dropzone" role="region" aria-label="Зона загрузки файла">
                <div class="dz-content">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
                    </svg>
                    <p>Перетащите файл или</p>
                    <label for="fileInput" class="btn-secondary">Выберите файл Excel</label>
                    <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" hidden />
                </div>
            </div>

            <!--
                report-container заполняется динамически из script.js.
                Статус, кнопки и таблицы рендерятся в JS — не захардкожены здесь.
            -->
            <div id="report-container" class="report-container" style="display: none;" aria-live="polite"></div>
        </main>

        <footer>
            <p>© 2026 • Обработка данных происходит только в браузере</p>
            <p>v16.05.26</p>
        </footer>
    </div>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
